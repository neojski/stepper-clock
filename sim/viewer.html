<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock Simulator</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #6d6b66;
    --line: #dedbd4;
    --dial: #fbfaf7;
    --hand: #1d1d1b;
    --target: #d9480f;
    --ok: #2b8a3e;
    --bad: #c92a2a;
    --limit: #c92a2a;
    --speed: #1c7ed6;
    --accel: #7048e8;
    --cursor: #d9480f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615;
      --panel: #1f1f1d;
      --ink: #ecebe7;
      --muted: #9a978f;
      --line: #34332f;
      --dial: #23231f;
      --hand: #ecebe7;
      --target: #ff8a4c;
      --ok: #51cf66;
      --bad: #ff6b6b;
      --limit: #ff6b6b;
      --speed: #4dabf7;
      --accel: #9775fa;
      --cursor: #ff8a4c;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615;
    --panel: #1f1f1d;
    --ink: #ecebe7;
    --muted: #9a978f;
    --line: #34332f;
    --dial: #23231f;
    --hand: #ecebe7;
    --target: #ff8a4c;
    --ok: #51cf66;
    --bad: #ff6b6b;
    --limit: #ff6b6b;
    --speed: #4dabf7;
    --accel: #9775fa;
    --cursor: #ff8a4c;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 32px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .summary { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    font-size: 12px; background: var(--panel); white-space: nowrap;
  }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
  .clock-card { padding: 16px; display: flex; justify-content: center; }
  #clock { width: 100%; max-width: 520px; aspect-ratio: 1; }
  .side { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .time { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .program { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 550; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .events-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .events { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 120px; max-height: 300px; }
  .events li {
    display: flex; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .events li:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .events li.past { color: var(--ink); }
  .events li.current { background: color-mix(in srgb, var(--cursor) 14%, transparent); }
  .events .when { flex: none; width: 64px; }
  .bottom { margin-top: 16px; padding: 14px 16px 16px; }
  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  button, select {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--muted); }
  #playButton { min-width: 84px; font-weight: 600; }
  .position { font-variant-numeric: tabular-nums; color: var(--muted); }
  .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
  #programBar { width: 100%; height: 14px; display: block; border-radius: 4px; cursor: pointer; }
  #scrubber { width: 100%; margin: 6px 0 10px; accent-color: var(--cursor); }
  #charts { width: 100%; height: 220px; display: block; cursor: crosshair; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .legend span::before {
    content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle;
    background: var(--c); border-top: var(--dash, none);
  }
  .program-legend { display: flex; flex-wrap: wrap; gap: 4px 6px; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .program-legend > span {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px;
    border: 1px solid transparent; border-radius: 999px;
  }
  .program-legend > span.current {
    color: var(--ink); border-color: var(--c);
    background: color-mix(in srgb, var(--c) 18%, transparent);
  }
  .missing { padding: 32px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  @media (max-width: 820px) {
    .main { grid-template-columns: minmax(0, 1fr); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stepper clock simulator</h1>
    <span class="summary" id="summary"></span>
    <div class="chips" id="chips"></div>
  </header>

  <div id="app" hidden>
    <div class="main">
      <div class="card clock-card"><canvas id="clock"></canvas></div>
      <div class="card side">
        <div>
          <div class="time" id="timeOfDay">--:--:--</div>
          <div class="program"><span class="swatch" id="programSwatch"></span><span id="programName"></span></div>
        </div>
        <div class="stats">
          <div class="stat"><div class="label">Speed</div><div class="value" id="speedValue"></div></div>
          <div class="stat"><div class="label">Accel</div><div class="value" id="accelValue"></div></div>
          <div class="stat"><div class="label">Error</div><div class="value" id="errorValue"></div></div>
        </div>
        <div class="events-title">Events</div>
        <ul class="events" id="events"></ul>
      </div>
    </div>

    <div class="card bottom">
      <div class="transport">
        <button id="playButton">Play</button>
        <select id="rate" aria-label="Playback speed">
          <option value="0.1">0.1×</option>
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="5">5×</option>
          <option value="10">10×</option>
        </select>
        <span class="position" id="position"></span>
        <span class="hint">Space play/pause · ←/→ 1s (shift 10s) · [ ] speed</span>
      </div>
      <div class="program-legend" id="programLegend"></div>
      <canvas id="programBar"></canvas>
      <input type="range" id="scrubber" min="0" step="0.01" value="0" aria-label="Position">
      <canvas id="charts"></canvas>
      <div class="legend">
        <span style="--c: var(--speed)">hand speed (°/s)</span>
        <span style="--c: var(--accel)">acceleration (°/s²)</span>
        <span style="--c: transparent; --dash: 2px dashed var(--limit)">motor limits</span>
      </div>
    </div>
  </div>

  <div class="card missing" id="missing" hidden>
    No recording found. Run <code>sim/run.sh</code> to simulate and open this page,
    e.g. <code>sim/run.sh --minutes 3 --play drop@5</code>.
  </div>
</div>

<script>
// viewer.html?trace=before shows build/before.js, a recording saved to compare with
document.write('<script src="build/' + (new URLSearchParams(location.search).get("trace") || "trace") + '.js"><\/script>');
</script>
<script src="build/stamp.js"></script>
<script>
// Reload when run.sh records a new run: it writes a new stamp.js. A script
// tag is the way to read a local file from a page opened from disk.
const loadedStamp = window.TRACE_STAMP;
setInterval(() => {
  const script = document.createElement("script");
  script.src = "build/stamp.js?" + Date.now();
  script.onload = () => {
    script.remove();
    if (window.TRACE_STAMP !== loadedStamp) {
      location.reload();
    }
  };
  script.onerror = () => script.remove();
  document.head.append(script);
}, 1500);

const trace = window.TRACE;
if (!trace) {
  document.getElementById("missing").hidden = false;
} else {
  document.getElementById("app").hidden = false;
  start(trace);
}

function start(trace) {
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const dt = trace.sampleMs / 1000;
  const count = trace.hand.length;
  const duration = (count - 1) * dt;

  const timeOfDay = (seconds, withMs) => {
    const ms = Math.round((trace.startMsOfDay + seconds * 1000) % 86400000);
    const pad = (x, n = 2) => String(x).padStart(n, "0");
    const text = `${pad(Math.floor(ms / 3600000))}:${pad(Math.floor(ms / 60000) % 60)}:${pad(Math.floor(ms / 1000) % 60)}`;
    return withMs ? `${text}.${pad(ms % 1000, 3)}` : text;
  };
  const wrapDeg = (d) => ((d % 360) + 540) % 360 - 180;

  // Program segments from the "program X" events
  const segments = [{ t: 0, name: trace.firstProgram }];
  for (const [t, text] of trace.events) {
    if (text.startsWith("program ")) {
      segments.push({ t, name: text.slice(8) });
    }
  }
  const palette = ["#1c7ed6", "#e8590c", "#2f9e44", "#ae3ec9", "#f59f00", "#0c8599", "#e64980",
    "#5c7cfa", "#74b816", "#a61e4d", "#868e96", "#d6336c", "#087f5b", "#862e9c"];
  const programColors = {};
  for (const s of segments) {
    if (!(s.name in programColors)) {
      programColors[s.name] = palette[Object.keys(programColors).length % palette.length];
    }
  }
  const legendItems = {};
  for (const [name, color] of Object.entries(programColors)) {
    const item = document.createElement("span");
    item.innerHTML = `<span class="swatch"></span>`;
    item.querySelector(".swatch").style.background = color;
    item.append(name);
    item.style.setProperty("--c", color);
    $("programLegend").append(item);
    legendItems[name] = item;
  }
  const programAt = (t) => {
    let current = segments[0];
    for (const s of segments) {
      if (s.t <= t) current = s;
    }
    return current;
  };

  // Header
  const loop = trace.loopJitterUs ? `${trace.loopUs}–${trace.loopUs + trace.loopJitterUs} µs` : `${trace.loopUs} µs`;
  $("summary").textContent = `${(duration / 60).toFixed(1)} min from ${timeOfDay(0)}, loop ${loop}`;
  const chip = (text, ok) => {
    const el = document.createElement("span");
    el.className = "chip " + (ok ? "ok" : "bad");
    el.textContent = text;
    $("chips").append(el);
  };
  chip(`peak ${Math.round(trace.maxSpeed)} / ${trace.speedLimit} °/s`, trace.maxSpeed <= trace.speedLimit);
  chip(`peak ${Math.round(trace.maxAccel)} / ${trace.accelLimit} °/s²`, trace.maxAccel <= trace.accelLimit);
  chip(`tracking ≤ ${trace.maxError.toFixed(2)}°`, trace.maxError <= 1);

  // Events list
  const eventItems = trace.events.map(([t, text]) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="when"></span><span class="what"></span>`;
    li.querySelector(".when").textContent = timeOfDay(t);
    li.querySelector(".what").textContent = text;
    li.addEventListener("click", () => seek(Math.max(0, t - 1)));
    $("events").append(li);
    return { t, li };
  });

  // Playback state
  let t = 0;
  let playing = false;
  let rate = 1;
  let lastFrame = null;

  const sample = (series, time) => {
    const x = Math.min(Math.max(time / dt, 0), count - 1);
    const i = Math.floor(x);
    const j = Math.min(i + 1, count - 1);
    return [series[i], series[j], x - i];
  };
  const angleAt = (series, time) => {
    const [a, b, f] = sample(series, time);
    return a + wrapDeg(b - a) * f;
  };
  const valueAt = (series, time) => {
    const [a, b, f] = sample(series, time);
    return a + (b - a) * f;
  };

  // Canvas helpers
  const fit = (canvas) => {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    return { ctx, w: rect.width, h: rect.height };
  };

  function drawClock() {
    const { ctx, w, h } = fit($("clock"));
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 6;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = css("--dial");
    ctx.strokeStyle = css("--line");
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    const at = (deg, radius) => {
      const a = (deg * Math.PI) / 180;
      return [cx + radius * Math.sin(a), cy - radius * Math.cos(a)];
    };
    for (let i = 0; i < 60; i++) {
      const big = i % 5 === 0;
      const [x1, y1] = at(i * 6, r * (big ? 0.86 : 0.91));
      const [x2, y2] = at(i * 6, r * 0.95);
      ctx.strokeStyle = big ? css("--ink") : css("--muted");
      ctx.globalAlpha = big ? 0.8 : 0.45;
      ctx.lineWidth = big ? 2.5 : 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = css("--muted");
    ctx.font = `500 ${Math.round(r * 0.08)}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 1; i <= 12; i++) {
      const [x, y] = at(i * 30, r * 0.76);
      ctx.fillText(String(i), x, y);
    }

    const hand = (deg, length, tail, width, color, alpha) => {
      const [x1, y1] = at(deg + 180, r * tail);
      const [x2, y2] = at(deg, r * length);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    };
    hand(angleAt(trace.target, t), 0.93, 0, Math.max(2, r * 0.008), css("--target"), 0.85);
    hand(angleAt(trace.hand, t), 0.88, 0.16, Math.max(4, r * 0.03), css("--hand"), 1);
    ctx.fillStyle = css("--hand");
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(5, r * 0.04), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawProgramBar() {
    const { ctx, w, h } = fit($("programBar"));
    ctx.clearRect(0, 0, w, h);
    segments.forEach((s, i) => {
      const end = i + 1 < segments.length ? segments[i + 1].t : duration;
      ctx.fillStyle = programColors[s.name];
      ctx.globalAlpha = 0.75;
      ctx.fillRect((s.t / duration) * w, 0, ((end - s.t) / duration) * w + 0.5, h);
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = css("--cursor");
    ctx.fillRect((t / duration) * w - 1, 0, 2, h);
  }

  // Charts: drawn once per size into an offscreen canvas, then the cursor on top
  let chartCache = null;
  function renderCharts(w, h, ratio) {
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(w * ratio);
    canvas.height = Math.round(h * ratio);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const panels = [
      { series: trace.speed, limit: trace.speedLimit, color: css("--speed"), label: "speed" },
      { series: trace.accel, limit: trace.accelLimit, color: css("--accel"), label: "accel" },
    ];
    const gap = 10;
    const panelH = (h - gap) / 2;
    panels.forEach((p, k) => {
      const top = k * (panelH + gap);
      const range = p.limit * 1.15;
      const y = (v) => top + panelH / 2 - (v / range) * (panelH / 2);
      ctx.fillStyle = css("--dial");
      ctx.fillRect(0, top, w, panelH);
      segments.forEach((s, i) => {
        const end = i + 1 < segments.length ? segments[i + 1].t : duration;
        ctx.fillStyle = programColors[s.name];
        ctx.globalAlpha = 0.07;
        ctx.fillRect((s.t / duration) * w, top, ((end - s.t) / duration) * w, panelH);
      });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = css("--line");
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y(0));
      ctx.lineTo(w, y(0));
      ctx.stroke();
      ctx.strokeStyle = css("--limit");
      ctx.setLineDash([4, 4]);
      for (const v of [p.limit, -p.limit]) {
        ctx.beginPath();
        ctx.moveTo(0, y(v));
        ctx.lineTo(w, y(v));
        ctx.stroke();
      }
      ctx.setLineDash([]);
      // Min/max per pixel column so short peaks still show
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      const columns = Math.max(1, Math.floor(w));
      for (let c = 0; c < columns; c++) {
        const i0 = Math.floor((c / columns) * count);
        const i1 = Math.max(i0 + 1, Math.floor(((c + 1) / columns) * count));
        let lo = Infinity, hi = -Infinity;
        for (let i = i0; i < i1 && i < count; i++) {
          lo = Math.min(lo, p.series[i]);
          hi = Math.max(hi, p.series[i]);
        }
        const clampY = (v) => y(Math.max(-range, Math.min(range, v)));
        ctx.moveTo(c + 0.5, clampY(hi));
        ctx.lineTo(c + 0.5, clampY(lo) + 0.5);
      }
      ctx.stroke();
      ctx.fillStyle = css("--muted");
      ctx.font = "11px system-ui, sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText(`${p.label} ±${p.limit}`, 6, top + 4);
    });
    return canvas;
  }

  function drawCharts() {
    const canvas = $("charts");
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const key = `${rect.width}x${rect.height}@${ratio}:${document.documentElement.dataset.theme || ""}`;
    if (!chartCache || chartCache.key !== key) {
      chartCache = { key, image: renderCharts(rect.width, rect.height, ratio) };
    }
    const { ctx, w, h } = fit(canvas);
    ctx.drawImage(chartCache.image, 0, 0, w, h);
    ctx.fillStyle = css("--cursor");
    ctx.fillRect((t / duration) * w - 1, 0, 2, h);
  }

  function updateReadouts() {
    $("timeOfDay").textContent = timeOfDay(t, true);
    const program = programAt(t);
    $("programName").textContent = program.name;
    $("programSwatch").style.background = programColors[program.name];
    for (const [name, item] of Object.entries(legendItems)) {
      item.classList.toggle("current", name === program.name);
    }
    $("speedValue").textContent = `${Math.round(valueAt(trace.speed, t))} °/s`;
    $("accelValue").textContent = `${Math.round(valueAt(trace.accel, t))} °/s²`;
    $("errorValue").textContent = `${Math.abs(wrapDeg(angleAt(trace.target, t) - angleAt(trace.hand, t))).toFixed(2)}°`;
    $("position").textContent = `${t.toFixed(2)} / ${duration.toFixed(0)} s`;
    $("scrubber").value = t;
    let current = null;
    for (const e of eventItems) {
      e.li.classList.toggle("past", e.t <= t);
      e.li.classList.remove("current");
      if (e.t <= t) current = e;
    }
    if (current) {
      current.li.classList.add("current");
    }
  }

  function render() {
    drawClock();
    drawProgramBar();
    drawCharts();
    updateReadouts();
  }

  function seek(time) {
    t = Math.min(Math.max(time, 0), duration);
    render();
    const current = eventItems.filter((e) => e.t <= t).pop();
    if (current) current.li.scrollIntoView({ block: "nearest" });
  }

  function setPlaying(value) {
    playing = value;
    if (playing && t >= duration) t = 0;
    $("playButton").textContent = playing ? "Pause" : "Play";
    lastFrame = null;
  }

  function frame(now) {
    if (playing) {
      if (lastFrame !== null) {
        t += ((now - lastFrame) / 1000) * rate;
        if (t >= duration) {
          t = duration;
          setPlaying(false);
        }
      }
      lastFrame = now;
      render();
    }
    requestAnimationFrame(frame);
  }

  // Controls
  $("scrubber").max = duration;
  $("scrubber").addEventListener("input", (e) => seek(parseFloat(e.target.value)));
  $("playButton").addEventListener("click", () => setPlaying(!playing));
  $("rate").addEventListener("change", (e) => (rate = parseFloat(e.target.value)));
  const seekFromPointer = (canvas, e) => {
    const rect = canvas.getBoundingClientRect();
    seek(((e.clientX - rect.left) / rect.width) * duration);
  };
  for (const id of ["charts", "programBar"]) {
    const canvas = $(id);
    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      seekFromPointer(canvas, e);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (canvas.hasPointerCapture(e.pointerId)) seekFromPointer(canvas, e);
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === " ") {
      e.preventDefault();
      setPlaying(!playing);
    } else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      seek(t + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 10 : 1));
    } else if (e.key === "[" || e.key === "]") {
      const select = $("rate");
      select.selectedIndex = Math.min(Math.max(select.selectedIndex + (e.key === "]" ? 1 : -1), 0), select.options.length - 1);
      rate = parseFloat(select.value);
    }
  });
  window.addEventListener("resize", render);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    chartCache = null;
    render();
  });

  // viewer.html#t=226&play starts at 226s, playing
  const startAt = location.hash.match(/t=([\d.]+)/);
  if (startAt) {
    t = Math.min(parseFloat(startAt[1]), duration);
  }
  render();
  if (location.hash.includes("play")) {
    setPlaying(true);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
